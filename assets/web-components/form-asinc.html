<script>

(function() {

var protoForm = Object.create(HTMLFormElement.prototype);

protoForm.createdCallback = function() {
	this.fcExito = null;
	this.fcError = null;

	this.addEventListener("submit", function(e) {
		e.preventDefault();

		var xhr = new XMLHttpRequest();
		var df = new FormData(this);

		xhr.open("POST", this.action, true);
		xhr.responseType = "json";
		xhr.addEventListener("load", this.fcExito);
		xhr.addEventListener("error", this.fcError);

		xhr.send(df);
	});
};



function checkboxes(form) {
	var chks = form.querySelectorAll("[type=checkbox]");
	var cant = chks.length;

	for(var i = 0; i < cant; ++i) {
		chks[i].value = chks[i].checked ? true : false;

		chks[i].checked = true;
	}
}

document.registerElement("form-asinc", { prototype: protoForm, extends: "form" });

})();

</script>
