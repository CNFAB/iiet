<template id="t_principal_consulta">
	<form class="sc_seccion_consultas">
		<header>
			<h2>Condiciones</h2>
		</header>
		<ul class="lista_condiciones condiciones_simples">
		</ul>
		<div class="sc_operaciones_condicion">

			<button type="button" title="Eliminar todas las condiciones"><img src="/iiet/assets/images/ic_basurero.png"></button>
			<button type="button" title="Agrupar condiciones seleccionadas"><img src="/iiet/assets/images/ic_nueva_lista.png"></button>
			<button type="submit" title="Ejecutar consulta" id="ejecutar_consulta"><img src="/iiet/assets/images/ic_play.png"></button>
			<div class="menu_restric menu_nueva_condicion oculto">

			<tbody></tbody>
		</table>
	</section>
</template>

			<button type="button" title="Marcar / Desmarcar"><img src="/iiet/assets/images/ic_enfocar.png"/></button>
			<button type="button" title="Remover"><img src="/iiet/assets/images/ic_basurero.png"/></button>
			<button type="button" title="Ascender"><img src="/iiet/assets/images/ic_flecha_arriba.png"/></button>
			<button type="button" title="Descender"><img src="/iiet/assets/images/ic_flecha_abajo.png"/></button>
			<button type="button" title="Negar"><img src="/iiet/assets/images/pn.png"/></button>
			<button type="button" title="Cerrar"><img src="/iiet/assets/images/ic_x.png"/></button>
		</div>
	</div>
</template>

<template id="t_condicion_compuesta">
	<div class="condiciones_compuestas restricciones">
		<input type="checkbox" name="negacion" class="oculto" />
		<span class="negacion">-</span>
		<ul class="lista_condiciones condiciones_simples"></ul>
		<input type="checkbox" class="nexo" name="nexo" />
		<div class="operaciones oculto">
			<button type="button" title="Marcar / Desmarcar"><img src="/iiet/assets/images/ic_enfocar.png"/></button>
			<button type="button" title="Remover"><img src="/iiet/assets/images/ic_basurero.png"/></button>
			<button type="button" title="Ascender"><img src="/iiet/assets/images/ic_flecha_arriba.png"/></button>
			<button type="button" title="Descender"><img src="/iiet/assets/images/ic_flecha_abajo.png"/></button>
			<button type="button" title="Negar"><img src="/iiet/assets/images/ic_positivo_negativo.png"/></button>
			<button type="button" title="Cerrar"><img src="/iiet/assets/images/ic_x.png"/></button>

	</div>

	<option value="<">sea menor a</option>
	<option value="<=">sea menor/igual a</option>
	<option value="=">sea igual a</option>
	<option value="<>">sea distinta a</option>
	<option value=">=">sea mayor/igual a</option>
	<option value=">">sea mayor a</option>

<template id="t_condicion_operadores_2">
	<option value="=">sea igual a</option>
	<option value="<>">sea distinto a</option>
</template>

<template id="t_condicion_operadores_3">
	<option value="=">sea igual a</option>
	<option value="<>">sea distinto a</option>
	<option value="comience">comience con</option>
	<option value="no_comience">no comience con</option>
	<option value="termine">termine con</option>
	<option value="no_termine">no termine con</option>

<template id="t_selec_tipo_campania">
	<select name="valor">
		<option value="BARRIO">Barrio</option>
		<option value="PARAJE">Paraje</option>
		<option value="ESCUELA">Escuela</option>
	</select>
</template>

<script>
(function() {
	
var documento = document.currentScript.ownerDocument;

var tPrincipalConsulta  = documento.getElementById('t_principal_consulta').content,
	tCondicionSimple 	= documento.getElementById('t_condicion_simple').content,
	tCondicionCompuesta = documento.getElementById('t_condicion_compuesta').content,
	tCondOperadores1    = documento.getElementById('t_condicion_operadores_1').content,
	tCondOperadores2    = documento.getElementById('t_condicion_operadores_2').content,
	tCondOperadores3    = documento.getElementById('t_condicion_operadores_3').content,
	tSelecTipoCampania  = documento.getElementById('t_selec_tipo_campania').content;


var protoConsultas = Object.create(HTMLDivElement.prototype);

protoConsultas.agregarCondicion = function(condicion) {
	var contenCondicion = document.createElement('li'),
		ultimoItem 		= this.listaCondiciones.children.length;

	contenCondicion.appendChild(condicion);
	contenCondicion.indice = ultimoItem;
	contenCondicion.addEventListener('mousedown', mostrarBarraOperaciones);
	contenCondicion.addEventListener('mouseup', e => contenCondicion.seleccionar = false);
	contenCondicion.obtenerConsultaJSON = obtenerConsultaSimpleJSON;
	contenCondicion.obtenerNexo = obtenerNexo;

	configBarraOperaciones(contenCondicion);

	this.listaCondiciones.appendChild(contenCondicion);

	return contenCondicion.children[0];
};

protoConsultas.nuevaCondicionFecha = function(titulo, nombre) {
	var clonCondicion = document.importNode(tCondicionSimple, true),
		clonOperad    = document.importNode(tCondOperadores1, true),
		condicion     = this.agregarCondicion(clonCondicion);

	condicion.children[2].textContent = titulo;
	condicion.children[3].value = nombre;
	condicion.children[4].appendChild(clonOperad);
	condicion.children[5].type = 'date';
};

protoConsultas.nuevaCondicionTipoCampania = function() {
	var clonCondicion = document.importNode(tCondicionSimple, true),
		clonOperad    = document.importNode(tCondOperadores2, true),
		clonSelTipo   = document.importNode(tSelecTipoCampania, true),
		condicion     = this.agregarCondicion(clonCondicion);

	condicion.children[2].textContent = 'Tipo campaña';
	condicion.children[3].value = 'tipo';
	condicion.children[4].appendChild(clonOperad);
	condicion.replaceChild(clonSelTipo, condicion.children[5]);
};

protoConsultas.nuevaCondicionTexto = function(titulo, nombre) {
	var clonCondicion = document.importNode(tCondicionSimple, true),
		clonOperad    = document.importNode(tCondOperadores3, true),
		condicion     = this.agregarCondicion(clonCondicion);

	condicion.children[2].textContent = titulo;
	condicion.children[3].value = nombre;
	condicion.children[4].appendChild(clonOperad);
	condicion.children[5].type = 'text';
};

protoConsultas.nuevaCondicionCompuesta = function(condiciones) {
	var clonCondicion = document.importNode(tCondicionCompuesta, true),
		contenCondiciones = document.createElement('li');
		ini = condiciones[0].indice;

	contenCondiciones.appendChild(clonCondicion);
	contenCondiciones.indice = ini;
	contenCondiciones.addEventListener('mousedown', mostrarBarraOperaciones);
	contenCondiciones.addEventListener('mouseup', e => contenCondiciones.seleccionar = false);
	configBarraOperaciones(contenCondiciones);
	contenCondiciones.obtenerConsultaJSON = obtenerConsultaCompuestaJSON;
	contenCondiciones.obtenerNexo = obtenerNexo;

	this.listaCondiciones.insertBefore(contenCondiciones, condiciones[0]);

	var condicionCompuesta = contenCondiciones.getElementsByClassName('condiciones_compuestas')[0],
		condicionesSimples = condicionCompuesta.children[2],
		cantCondiciones = condiciones.length;

	for(var i = 0; i < cantCondiciones; ++i) {
		condicionesSimples.appendChild(condiciones[0]);

		condiciones[0].indice = i;
		cerrarBarraOperaciones(condiciones[0]);
		seleccionarCondicion(condiciones[0]);
	}

	var cantHijos = this.listaCondiciones.children.length;

	for(let i = ini + 1; i < cantHijos; ++i)
		++this.listaCondiciones.children[i].indice;
};

function mostrarBarraOperaciones(e) {
	e.stopPropagation();

	var el = e.target;

	if(el.nodeName == 'INPUT' || el.nodeName == 'SELECT')
		return;

	contenedor = obtenerContenedorConsulta(el);
	contenedor.seleccionar = true;

	window.setTimeout(() => {
		if(contenedor.seleccionar) {
			var barra = obtenerBarraOperaciones(contenedor);

			barra.className = barra.className.replace(/(?:^|\s)oculto(?!\S)/g , '');
			contenedor.seleccionar = false;
		}
	}, 300);
};

function obtenerBarraOperaciones(contenedor) {
	var barra;

	if(contenedor.children[0].className == 'condiciones_simples')
		barra = contenedor.children[0].children[7];

	else
		barra = contenedor.children[0].children[4];

	return barra;
};

function configBarraOperaciones(contenedor) {
	var barra = obtenerBarraOperaciones(contenedor);

	barra.children[0].addEventListener('click', e => seleccionarCondicion(contenedor));
	barra.children[1].addEventListener('click', e => eliminarCondicion(contenedor));
	barra.children[2].addEventListener('click', e => subirCondicion(contenedor));
	barra.children[3].addEventListener('click', e => bajarCondicion(contenedor));
	barra.children[4].addEventListener('click', e => negarCondicion(contenedor));
	barra.children[5].addEventListener('click', e => cerrarBarraOperaciones(contenedor));
};

function obtenerContenedorConsulta(elemento) {
	if(elemento.nodeName == 'LI')
		return elemento;

	else if(elemento.nodeName == 'BODY')
		return undefined;

	else
		return obtenerContenedorConsulta(elemento.parentNode);
}

function seleccionarCondicion(contenedor) {
	contenedor.className = contenedor.className == 'marcado' ? '' : 'marcado';
}

function eliminarCondicion(contenedor) {
	var padre = contenedor.parentNode,
		indice = contenedor.indice
		cantidad = padre.children.length;

	for(let i = indice + 1; i < cantidad; ++i)
		--padre.children[i].indice;

	padre.removeChild(contenedor);
}

function subirCondicion(contenedor) {
	var padre = contenedor.parentNode,
		indice = contenedor.indice,
		cantidad = padre.children.length;

	if(cantidad > 1 && indice > 0) {
		let anterior = padre.children[indice - 1];

		++anterior.indice;
		--contenedor.indice;
		padre.insertBefore(contenedor, anterior);
	}
}

function bajarCondicion(contenedor) {
	var padre = contenedor.parentNode,
		indice = contenedor.indice,
		cantidad = padre.children.length;

	if(cantidad > 1 && indice < cantidad - 1) {
		let posterior = padre.children[indice + 1];

		--posterior.indice;
		++contenedor.indice;
		padre.insertBefore(posterior, contenedor);
	}
}

function negarCondicion(contenedor) {
	var div = contenedor.children[0];

	div.children[0].checked = div.children[0].checked ? false : true;
}

function cerrarBarraOperaciones(contenedor) {
	var barra = obtenerBarraOperaciones(contenedor);
	barra.className += ' oculto';
}

function obtenerConsultaSimpleJSON() {
	var div = this.children[0];

	return {
		tipo: 'simple',
		neg: div.children[0].checked,
		cond: [
			div.children[3].value,
			div.children[4].value,
			div.children[5].value
		]
	}
}

function obtenerConsultaCompuestaJSON() {
	var div = this.children[0],
		condicionesSimples = div.children[2].children,
		arrSubConsultas = new Array();

	for(let condicion of condicionesSimples) {
		arrSubConsultas.push(condicion.obtenerConsultaJSON());
		arrSubConsultas.push(condicion.obtenerNexo());
	}

	arrSubConsultas.pop();

	return {
		tipo: 'compuesto',
		neg: div.children[0].checked,
		cond: arrSubConsultas
	};
}

function obtenerNexo() {
	var div = this.children[0];
	var nexo;

	return div.className == 'condiciones_simples' ?
				div.children[6].checked ? "or" : "and"
			:
				div.children[3].checked ? "or" : "and";
}

function obtenerConsultasJSON() {
	var condiciones = new Array();

	for(let condicion of this.children) {
		condiciones.push(condicion.obtenerConsultaJSON());
		condiciones.push(condicion.obtenerNexo());
	}

	condiciones.pop();

	return {
		tabla: this.tabla,
		campos: this.campos || [],
		condicion: {
			tipo: 'compuesto',
			neg: false,
			cond: condiciones
		}
	};
}

protoConsultas.agruparCondiciones = function() {
	var seleccion = this.getElementsByClassName('marcado');

	if(seleccion.length < 2)
		return;

	for(let i = 1; i < seleccion.length; ++i)
		if(seleccion[i].indice - seleccion[i-1].indice !== 1)
			return;

	this.nuevaCondicionCompuesta(seleccion);
}

protoConsultas.crearMenuNuevaCondicion = function(objeto) {
	var self = this;

	this.menu.items.innerHTML = '';

	for(let dato of objeto) {
		let item = document.createElement('li'),
			boton = document.createElement('button');

		boton.type = 'button';
		boton.textContent = dato.texto;
		item.appendChild(boton);
		item.addEventListener('click', e => {
			dato.accion();
			self.ocultarMenuNuevaCondicion();
		});

		this.menu.items.appendChild(item);
	}
};

protoConsultas.ocultarMenuNuevaCondicion = function() {
	this.menu.className += ' oculto';
};

protoConsultas.establecerCabeceraTablaResultados = function(cabecera) {
	var fila = this.tablaResultados.insertRow();

	fila.insertCells('th', cabecera);
};

protoConsultas.createdCallback = function() {
	var clon = document.importNode(tPrincipalConsulta, true),
		self = this

	this.appendChild(clon);
	
	var btnsOpCons = this.children[0].children[2];

	this.listaCondiciones = this.children[0].children[1];
	this.listaCondiciones.obtenerConsultasJSON = obtenerConsultasJSON;
	this.menu = this.querySelector('.menu_nueva_condicion');
	this.menu.items = this.menu.children[1];
	this.tablaResultados = this.getElementsByClassName('sc_tabla_resultados')[0];

	btnsOpCons.children[0].addEventListener('click', e => {
		self.menu.className = self.menu.className.replace(/(?:^|\s)oculto(?!\S)/g , '');
	});
	btnsOpCons.children[1].addEventListener('click', e => self.listaCondiciones.innerHTML = '');
	btnsOpCons.children[2].addEventListener('click', e => self.agruparCondiciones());

	this.menu.children[2].addEventListener('click', e => self.ocultarMenuNuevaCondicion());

	this.accionRespuestaConsulta = null;
	this.children[0].addEventListener('submit', e => {
		e.preventDefault();

		var json = self.listaCondiciones.obtenerConsultasJSON(),
			xhr = new XMLHttpRequest();

		xhr.open('POST', '/iiet/consultas', true);
		xhr.responseType = 'json';
		xhr.setRequestHeader('Content-Type', 'application/json; charset=UTF-8');

		xhr.addEventListener('load', self.accionRespuestaConsulta);
		xhr.send(JSON.stringify(json));
	});

	window.addEventListener('load', e => {
		btnsOpCons.children[3].click();
	});
};

document.registerElement('secc-consultas', { prototype: protoConsultas });

})();
</script>
