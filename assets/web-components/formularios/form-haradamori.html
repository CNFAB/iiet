<template>
	<label class="etiqueta">Harada y Mori
		<input type="checkbox" class="activar" name="harada_mori" />
	</label>

	<fieldset class="datos_formulario" disabled="disabled">
		<label>Strongyloides
			<select name="harada_mori[strongyloides]" required="required">
				<option></option>
				<option value="+">+</option>
				<option value="++">++</option>
				<option value="+++">+++</option>
				<option value="NEGATIVO">Negativo</option>
			</select>
		</label>
		<label>Ancylostoma
			<select name="harada_mori[ancylostoma]" required="required">
				<option></option>
				<option value="+">+</option>
				<option value="++">++</option>
				<option value="+++">+++</option>
				<option value="NEGATIVO">Negativo</option>
			</select>
		</label>
		<label>Necator
			<select name="harada_mori[necator]" required="required">
				<option></option>
				<option value="+">+</option>
				<option value="++">++</option>
				<option value="+++">+++</option>
				<option value="NEGATIVO">Negativo</option>
			</select>
		</label>
		<label>Enterobius
			<select name="harada_mori[enterobius]" required="required">
				<option></option>
				<option value="+">+</option>
				<option value="++">++</option>
				<option value="+++">+++</option>
				<option value="NEGATIVO">Negativo</option>
			</select>
		</label>
		<div class="btn_negativo">
			<button type="button">Completar con Negativos</button>
		</div>
	</fieldset>
</template>

<script>

protoFormHaradaMori = Object.create(PrototipoFormulario);

protoFormHaradaMori.template = document.currentScript.ownerDocument.querySelector("template").content;
protoFormHaradaMori.opcNegativo = 4;

protoFormHaradaMori.establecerPropiedades = function() {
	PrototipoFormulario.establecerPropiedades.call(this);

	this.campos = this.datosFormulario.querySelectorAll("select");
	this.negativo = this.datosFormulario.querySelector("button");
	this.negativo.clicked = false;
};

protoFormHaradaMori.establecerEventos = function() {
	var self = this;

	PrototipoFormulario.establecerEventos.call(this);

	this.negativo.addEventListener("click", function(e) {
		if(!this.clicked) {
			for(var i = 0; i < self.campos.length; ++i)
				if(self.campos[i].selectedIndex == 0)
					self.campos[i].selectedIndex = self.opcNegativo;

			this.innerHTML = "Deshacer Negativos";
		}

		else {
			for(var i = 0; i < self.campos.length; ++i)
				if(self.campos[i].selectedIndex == self.opcNegativo)
					self.campos[i].selectedIndex = 0;

			this.innerHTML = "Completar con Negativos";
		}

		this.clicked = !this.clicked;
	});
};

protoFormHaradaMori.deshabilitar = function() {
	PrototipoFormulario.deshabilitar.call(this);

	for(var i = 0; i < this.campos.length; ++i)
		this.campos[i].selectedIndex = 0;

	this.negativo.clicked = false;
	this.negativo.innerHTML = "Completar con Negativos";
};

document.registerElement("form-haradamori", { prototype: protoFormHaradaMori });

</script>
