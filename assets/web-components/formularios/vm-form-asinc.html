			<h1>Nuevo Paciente</h1>
		</header>
		<section>
			<form is="form-asinc" name="nuevo_paciente">
				<fieldset class="datos_paciente">
					<label>DNI
						<input type="number" name="dni" required="required" />
					</label>
					<label>Apellidos
						<input type="text" name="apellido" required="required" />
					</label>
					<label>Nombres
						<input type="text" name="nombre" required="required" />
					</label>
					<label>Fecha de Nacimiento
						<input type="date" name="fecha_nacimiento" required="required" />
					</label>
					<fieldset class="grupo_radio">
						<legend>Sexo</legend>

						<label>Masculino
							<input type="radio" name="sexo" value="MASCULINO" />
						</label>
						<label>Femenino
							<input type="radio" name="sexo" value="FEMENINO" />
						</label>
					</fieldset>
					<fieldset>
						<legend>Domicilio</legend>

						<label>Departamento
							<select name="departamento">
								<option>Or&aacute;n</option>
								<option>San Mart&iacute;n</option>
							</select>
						</label>
						<label>Localidad
							<select name="localidad">
								<option>San Ram&oacute;n de la Nueva Or&aacute;n</option>
								<option>Pichanal</option>
								<option>Colonia Santa Rosa</option>
								<option>Urundel</option>
							</select>
						</label>
						<div class="grupo_radio">
							<label>Paraje
								<input type="radio" id="r_paraje" name="lugar" value="PARAJE" checked="checked" />
							</label>
							<label>Barrio
								<input type="radio" name="lugar" value="BARRIO" />
							</label>
						</div>
						<div class="select_lugar">
							<select name="paraje" required="required">
								<option>Solazuty</option>
								<option>Media Luna</option>
								<option>Otro Paraje</option>
							</select>
							<select name="barrio" required="required" disabled="disabled">
								<option>Barrio 1</option>
								<option>Barrio 2</option>
								<option>Barrio 3</option>
							</select>
						</div>
						<label>Direcci&oacute;n
							<input type="text" name="domicilio" />
						</label>
					</fieldset>
					<div class="submit">
						<input type="submit" value="Guardar" />
						<input type="reset" value="Cancelar" />
					</div>
				</fieldset>
			</form>
		</section>
	</ventana-modal>
</template>

<script>
	
var templateNuevaCampania, templateNuevoPaciente;

(function() {
	var templates = document.currentScript.ownerDocument.querySelectorAll("template");

	templateNuevaCampania = templates[0].content;
	templateNuevoPaciente = templates[1].content;
})();



function habilitarParaje(formulario) {
	formulario.paraje.disabled = null;
	formulario.barrio.disabled = "disabled";
}

function habilitarBarrio(formulario) {
	formulario.paraje.disabled = "disabled";
	formulario.barrio.disabled = null;
}

function seleccionarLugar(formulario) {
	if(formulario.lugar[0].checked) {
		habilitarParaje(formulario);
	}

	else {
		habilitarBarrio(formulario);
	}
}

function habilitarEscuela(formulario) {
	formulario.escuela.disabled = null;
}

function deshabilitarEscuela(formulario) {
	formulario.escuela.disabled = "disabled";
}


function inicializarFormAsinc() {
	var vmNuevaCampania = document.getElementById("nueva_campania");
	var vmNuevoPaciente = document.getElementById("nuevo_paciente");
	var nuevaCampania = document.nueva_campania;
	var nuevoPaciente = document.nuevo_paciente;
	var chkEscuela = nuevaCampania.en_escuela;

	nuevaCampania.lugar[0].addEventListener("click", function(e) { seleccionarLugar(nuevaCampania) });
	nuevaCampania.lugar[1].addEventListener("click", function(e) { seleccionarLugar(nuevaCampania) });

	nuevoPaciente.lugar[0].addEventListener("click", function(e) { seleccionarLugar(nuevoPaciente) });
	nuevoPaciente.lugar[1].addEventListener("click", function(e) { seleccionarLugar(nuevoPaciente) });


	vmNuevaCampania.close = function(formulario) {
		if(formulario === undefined)
			nuevaCampania.reset();

		else
			Object.getPrototypeOf(vmNuevaCampania).close();
	};

	nuevaCampania.addEventListener("reset", function(e) {
		habilitarParaje(this);
		deshabilitarEscuela(this);

		vmNuevaCampania.close(this);
	});

	chkEscuela.addEventListener("click", function(e) {
		if(this.checked)
			habilitarEscuela(nuevaCampania);

		else
			deshabilitarEscuela(nuevaCampania);
	});

	vmNuevoPaciente.close = function(formulario) {
		if(formulario === undefined)
			nuevoPaciente.reset();

		else
			Object.getPrototypeOf(vmNuevoPaciente).close();
	};

	nuevoPaciente.addEventListener("reset", function(e) {
		habilitarParaje(this);

		vmNuevoPaciente.close(this);
	});
}

</script>
