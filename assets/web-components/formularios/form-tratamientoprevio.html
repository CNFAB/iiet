<template>
	<label class="etiqueta">Tratamiento Previo
		<input type="checkbox" class="activar" name="tratamiento_previo" />
	</label>

	<fieldset class="datos_formulario" disabled="disabled">
		<label>Fecha
			<input type="date" name="tratamiento_previo[fecha]" required="required" />
		</label>
		<label>Mebendazol
			<input type="checkbox" name="tratamiento_previo[mebendazol]" />
		</label>
		<label>Albendazol
			<input type="checkbox" name="tratamiento_previo[albendazol]" />
		</label>
		<label>Ivermectina
			<input type="checkbox" name="tratamiento_previo[ivermectina]" />
		</label>
		<label>Metrodinazol
			<input type="checkbox" name="tratamiento_previo[metrodinazol]" />
		</label>
		<label>Otros
			<input type="text" name="tratamiento_previo[otros]" />
		</label>
	</fieldset>
</template>

<script>
	
protoFormTratamientoPrevio = Object.create(PrototipoFormulario);

protoFormTratamientoPrevio.template = document.currentScript.ownerDocument.querySelector("template").content;

protoFormTratamientoPrevio.establecerPropiedades = function() {
	PrototipoFormulario.establecerPropiedades.call(this);

	this.campos = this.datosFormulario.querySelectorAll("input");
};

protoFormTratamientoPrevio.deshabilitar = function() {
	PrototipoFormulario.deshabilitar.call(this);

	this.campos[0].value = null;

	for(var i = 1; i < this.campos.length - 1; ++i)
		this.campos[i].checked = false;

	this.campos[this.campos.length - 1].value = null;
};

document.registerElement("form-tratamientoprevio", { prototype: protoFormTratamientoPrevio });

</script>
