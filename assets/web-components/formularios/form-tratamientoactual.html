<script>
	
protoMebendazol = Object.create(PrototipoFormulario);
protoAlbendazol = Object.create(PrototipoFormulario);
protoIvermectina = Object.create(PrototipoFormulario);

protoMebendazol.template = document.currentScript.ownerDocument.querySelectorAll("template")[0].content;
protoAlbendazol.template = document.currentScript.ownerDocument.querySelectorAll("template")[1].content;
protoIvermectina.template = document.currentScript.ownerDocument.querySelectorAll("template")[2].content;

function fEstablecerPropiedades() {
	PrototipoFormulario.establecerPropiedades.call(this);

	this.motivoExclusion = this.querySelectorAll(".datos_formulario")[1];
	this.campos = this.datosFormulario.querySelectorAll("input");
	this.exclusion = this.motivoExclusion.querySelector("select");
}

function fHabilitar() {
	PrototipoFormulario.habilitar.call(this);

	this.motivoExclusion.disabled = "disabled";
	this.exclusion.selectedIndex = 0;
}

function fDeshabilitar() {
	PrototipoFormulario.deshabilitar.call(this);

	for(var i = 0; i < this.campos.length; ++i)
		this.campos[i].value = null;

	this.motivoExclusion.disabled = null;
};

protoMebendazol.establecerPropiedades = fEstablecerPropiedades;
protoMebendazol.habilitar = fHabilitar;
protoMebendazol.deshabilitar = fDeshabilitar;

protoAlbendazol.establecerPropiedades = fEstablecerPropiedades;
protoAlbendazol.habilitar = fHabilitar;
protoAlbendazol.deshabilitar = fDeshabilitar;

protoIvermectina.establecerPropiedades = fEstablecerPropiedades;
protoIvermectina.habilitar = fHabilitar;
protoIvermectina.deshabilitar = fDeshabilitar;
