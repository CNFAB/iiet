<template>
	<label class="etiqueta">Serolog&iacute;a Strongyloides
		<input type="checkbox" class="activar" name="serologia" />
	</label>

	<fieldset class="datos_formulario" disabled="disabled">
		<label>T&iacute;tulo
			<input type="text" class="numero" name="serologia[titulo]" pattern="^\d*(\.\d{1,2})?$" required="required" />
			<span>U</span>
		</label>
		<label>Resultado
			<input type="text" name="serologia[resultado]" disabled="disabled" />
		</label>
	</fieldset>
</template>

<script>
	
protoFormSerologia = Object.create(PrototipoFormulario);

protoFormSerologia.template = document.currentScript.ownerDocument.querySelector("template").content;

protoFormSerologia.establecerPropiedades = function() {
	var self = this;

	PrototipoFormulario.establecerPropiedades.call(this);

	this.campos = this.datosFormulario.querySelectorAll("input");

	this.campos[0].addEventListener("change", function(e) {
		var valor = this.value - 0;

		self.campos[1].value = valor >= 120 ? "POSITIVO" : "NEGATIVO";
	});
};

protoFormSerologia.deshabilitar = function() {
	PrototipoFormulario.deshabilitar.call(this);

	this.campos[0].value = null;
	this.campos[1].value = null;
};

document.registerElement("form-serologia", { prototype: protoFormSerologia });

</script>
